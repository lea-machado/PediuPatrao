<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gerenciar Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container mt-5" th:fragment="content">
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">

        <h1 class="mb-4">Gestão de Produtos</h1>

        <!-- Botão para abrir o formulário -->
        <button class="btn btn-primary mb-3" data-bs-toggle="collapse" data-bs-target="#formularioProduto">
            Novo Produto
        </button>

        <!-- Formulário de Cadastro -->
        <div class="collapse" id="formularioProduto">
            <div class="card card-body">
                <form th:action="@{/api/produtos}" method="post" id="produtoForm">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome do Produto</label>
                        <input type="text" id="nome" name="nome" class="form-control" placeholder="Nome do Produto"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="tipo" class="form-label">Tipo do Produto</label>
                        <select id="tipo" name="tipo" class="form-select" required>
                            <option value="" disabled selected>Selecione o Tipo</option>
                            <option value="Pizza">Pizza</option>
                            <option value="Lanche">Lanche</option>
                            <option value="Bebida">Bebida</option>
                            <option value="Porção">Porção</option>
                            <option value="Adicional">Adicional</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="preco" class="form-label">Preço</label>
                        <input type="number" id="preco" name="preco" class="form-control" placeholder="Preço (R$)"
                            step="0.01" required>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" id="ativo" name="ativo" class="form-check-input">
                        <label for="ativo" class="form-check-label">Produto Ativo</label>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-success">Salvar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Listagem de Produtos -->
        <table class="table table-bordered table-striped mt-3">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Preço</th>
                    <th>Ativo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Loop para listar os produtos -->
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.id}"></td>
                    <td th:text="${produto.nome}"></td>
                    <td th:text="${produto.tipo}"></td>
                    <td th:text="${#numbers.formatDecimal(produto.preco, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${produto.ativo ? 'Sim' : 'Não'}">Sim</td>
                    <td>
                        <button type="button" class="btn btn-warning btn-sm editar-produto"
                            th:attr="data-id=${produto.id},data-nome=${produto.nome},data-tipo=${produto.tipo},data-preco=${produto.preco},data-ativo=${produto.ativo}">Editar</button>
                        <button type="button" class="btn btn-danger btn-sm excluir-produto"
                            th:attr="data-id=${produto.id}">Excluir</button>
                    </td>
                </tr>
            </tbody>
        </table>
        <script>
            (function () {
                const formulario = document.getElementById('produtoForm');
                const token = document.querySelector('meta[name="_csrf"]').content;
                const nomeHeader = document.querySelector('meta[name="_csrf_header"]').content;
                let produtoEmEdicao = null;

                formulario.addEventListener('submit', async function (evento) {
                    evento.preventDefault();
                    const produto = {
                        nome: document.getElementById('nome').value.trim(),
                        tipo: document.getElementById('tipo').value,
                        preco: Number(document.getElementById('preco').value),
                        ativo: document.getElementById('ativo').checked
                    };
                    try {
                        const url = produtoEmEdicao ? `/api/produtos/${encodeURIComponent(produtoEmEdicao)}` : '/api/produtos';
                        const resposta = await fetch(url, {
                            method: produtoEmEdicao ? 'PUT' : 'POST',
                            headers: {'Content-Type': 'application/json', [nomeHeader]: token},
                            body: JSON.stringify(produto)
                        });
                        if (!resposta.ok) throw new Error(`Não foi possível salvar o produto (${resposta.status}).`);
                        window.location.reload();
                    } catch (erro) {
                        alert(erro.message);
                    }
                });

                document.querySelectorAll('.editar-produto').forEach(botao => {
                    botao.addEventListener('click', function () {
                        produtoEmEdicao = this.dataset.id;
                        document.getElementById('nome').value = this.dataset.nome;
                        document.getElementById('tipo').value = this.dataset.tipo;
                        document.getElementById('preco').value = this.dataset.preco;
                        document.getElementById('ativo').checked = this.dataset.ativo === 'true';
                        bootstrap.Collapse.getOrCreateInstance(document.getElementById('formularioProduto')).show();
                        document.getElementById('nome').focus();
                    });
                });

                document.querySelectorAll('.excluir-produto').forEach(botao => {
                    botao.addEventListener('click', async function () {
                        if (!confirm('Tem certeza que deseja excluir este produto?')) return;
                        try {
                            const resposta = await fetch(`/api/produtos/${encodeURIComponent(this.dataset.id)}`, {
                                method: 'DELETE',
                                headers: {[nomeHeader]: token}
                            });
                            if (!resposta.ok) throw new Error(`Não foi possível excluir o produto (${resposta.status}).`);
                            window.location.reload();
                        } catch (erro) {
                            alert(erro.message);
                        }
                    });
                });
            })();
        </script>
    </div>
</body>

</html>
