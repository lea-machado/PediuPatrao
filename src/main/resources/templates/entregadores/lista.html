<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="content">
        <h2>Entregadores</h2>
        <div class="card mb-3" th:if="${podeCadastrarEntregador}">
            <div class="card-body">
                <form th:action="@{/entregadores}" method="post" class="row g-2 align-items-end">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="col-md-8">
                        <label class="form-label" for="nomeEntregador">Nome do entregador</label>
                        <input class="form-control" type="text" id="nomeEntregador" name="nome" maxlength="100"
                            required>
                    </div>
                    <div class="col-md-4"><button type="submit" class="btn btn-primary">Cadastrar entregador</button>
                    </div>
                </form>
            </div>
        </div>
        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
        <div class="card">
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Nome</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="entregador : ${entregadores}">
                            <td th:text="${entregador.nome}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(entregadores)}">
                            <td>Nenhum entregador cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
