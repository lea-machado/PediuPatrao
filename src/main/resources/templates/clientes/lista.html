<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Lista de Clientes</title>
</head>

<body>
    <div th:fragment="content">
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">
                <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
            </h2>
            <a th:if="${podeEditarCliente}" href="/clientes/novo" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Novo Cliente
            </a>
        </div>

        <!-- Tabela de clientes -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>Endereço</th>
                            <th class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="clientes-tabela">
                        <!-- Linhas carregadas via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <script th:inline="javascript">
            const podeExcluirCliente = /*[[${podeExcluirCliente}]]*/ false;
            const podeEditarCliente = /*[[${podeEditarCliente}]]*/ false;
            const csrfTokenCliente = document.querySelector('meta[name="_csrf"]').content;
            const csrfHeaderCliente = document.querySelector('meta[name="_csrf_header"]').content;
            const API_URL = '/api/clientes';
            const tabelaClientes = document.getElementById('clientes-tabela');

            function formatarEndereco(cliente) {
                const partes = [
                    cliente.logradouro,
                    cliente.numero,
                    cliente.complemento,
                    cliente.bairro,
                    cliente.cidade,
                    cliente.estado
                ].filter(p => p && p.trim() !== '');

                return partes.length > 0 ? partes.join(', ') : (cliente.endereco || '—');
            }

            async function carregarClientes() {
                try {
                    const response = await fetch(API_URL);
                    if (!response.ok) {
                        throw new Error('Erro HTTP ' + response.status);
                    }
                    const clientes = await response.json();
                    tabelaClientes.innerHTML = '';

                if (clientes.length === 0) {
                    tabelaClientes.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>`;
                    return;
                }

                clientes.forEach(cliente => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                    <td>${cliente.nome || '—'}</td>
                    <td>${cliente.telefone || '—'}</td>
                    <td>${formatarEndereco(cliente)}</td>
                    <td class="text-end pe-4">
                        ${podeEditarCliente ? `
                    <a href="/clientes/editar/${cliente.id}" class="btn btn-sm btn-outline-primary me-1">
                        <i class="bi bi-pencil-fill"></i> Editar
                    </a>
                ` : ''}
                        ${podeExcluirCliente ? `
                            <button class="btn btn-sm btn-outline-danger" onclick="excluirCliente('${cliente.id}')">
                                <i class="bi bi-trash-fill"></i> Excluir
                            </button>
                        ` : ''}
                    </td>
                `;
                    tabelaClientes.appendChild(row);
                });
                } catch (erro) {
                    console.error('Erro ao carregar clientes:', erro);
                    tabelaClientes.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">Não foi possível carregar os clientes.</td></tr>';
                }
            }

            async function excluirCliente(id) {
                if (confirm('Tem certeza que deseja excluir este cliente?')) {
                    const response = await fetch(`${API_URL}/${id}`, {method: 'DELETE', headers: {[csrfHeaderCliente]: csrfTokenCliente}});
                    if (response.ok) {
                        alert('Cliente excluído com sucesso!');
                        carregarClientes();
                    } else {
                        alert('Erro ao excluir o cliente.');
                    }
                }
            }

            carregarClientes();
        </script>
    </div>
</body>

</html>
